[package]
name = "terra-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU compute pipelines for terrain simulation (WGSL)"

[dependencies]
terra-core = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
profiling = { workspace = true }

[dev-dependencies]
terra-test-gpu = { workspace = true }
image = { workspace = true }

[features]
default = []
# The full GPU/CPU numerical matrix takes several minutes. Keep it out of
# ordinary package/workspace tests; the dedicated GPU job enables it explicitly.
gpu-parity = []

[[test]]
name = "parity_matrix"
path = "tests/parity_matrix.rs"
required-features = ["gpu-parity"]

[lints]
workspace = true
