name: Windows CI

on:
  push:
    tags:
      - "brooteskan-v*"

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        # Lint policy lives in `[workspace.lints.clippy]` (Cargo.toml); see issue #74.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Build release binary
        run: cargo build --locked --release -p terra-app
      - name: Smoke test release binary
        shell: pwsh
        run: |
          .\target\release\terra.exe --version
          .\target\release\terra.exe --self-check
