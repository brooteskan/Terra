name: CPU terrain contract

on:
  push:
    tags:
      - "brooteskan-v*"

jobs:
  determinism-tiling-and-halos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run CPU determinism contract
        run: cargo test -p terra-cpu-eval --test cpu_determinism_contract
      - name: Run simulation numerical contract
        run: cargo test -p terra-cpu-eval --test simulation_numerical_contract
      - name: Run Infinite traversal, evaluation, and persistence contracts
        run: |
          cargo test -p terra-core --lib terrain::demand::tests::infinite
          cargo test -p terra-core --lib terrain::work::tests
          cargo test -p terra-cpu-eval --test infinite_tile_evaluation
          cargo test -p terra-io --lib infinite_project_save_close_and_reopen_preserves_identity_without_tiles
          cargo test -p terra-core --lib document::tests
      - name: Run debris-flow numerical regressions
        run: |
          cargo test -p terra-core --lib pick_receiver
          cargo test -p terra-core --test debris_flow_mass
          cargo test -p terra-cpu-eval --test erosion_state_handoff
