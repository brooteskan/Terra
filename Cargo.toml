[workspace]
resolver = "2"
members = [
    "crates/terra-core",
    "crates/terra-gpu",
    "crates/terra-render",
    "crates/terra-gui",
    "crates/terra-io",
    "crates/terra-app",
    "crates/terra-test-gpu",
]
default-members = ["crates/terra-app"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "MIT"
authors = ["Terra Contributors"]
repository = "https://github.com/brooteskan/Terra"

[workspace.dependencies]
terra-core = { path = "crates/terra-core" }
terra-gpu = { path = "crates/terra-gpu" }
terra-render = { path = "crates/terra-render" }
terra-gui = { path = "crates/terra-gui" }
terra-io = { path = "crates/terra-io" }
terra-test-gpu = { path = "crates/terra-test-gpu" }

glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
flexi_logger = { version = "0.31", default-features = false }
profiling = { version = "1", default-features = false }
rfd = "0.15"
directories = "6"

wgpu = "24"
winit = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
